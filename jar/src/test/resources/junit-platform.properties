# Enable auto-detection of JUnit Jupiter extensions declared via
# META-INF/services/org.junit.jupiter.api.extension.Extension.
# Used to register jline.testutil.LineVerboseSilencer suite-wide so the solver
# console output stays quiet during the test run.
junit.jupiter.extensions.autodetection.enabled=true

# PARALLEL EXECUTION IS OPT-IN, PER CLASS. The default stays same_thread, so no
# existing test changes behaviour; a class that declares
# @Execution(ExecutionMode.CONCURRENT) opts in. jline.parity.ParityStaticTest is
# the one that does: each of its 209 cases is an isolated SUBPROCESS, so the
# wall clock is a queue of JVM launches rather than shared state.
# Override the width on the command line with
#   -Djunit.jupiter.execution.parallel.config.fixed.parallelism=<n>
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
